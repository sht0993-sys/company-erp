<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의 대장 · (주)성환공구</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#f4f5f7;color:#1f2937;font-size:15px}
  header{background:#1f3a5f;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  header h1{margin:0;font-size:18px}
  header a{color:#cfe0f5;font-size:13px;text-decoration:none}
  main{max-width:1000px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid #dde1e7;border-radius:8px;padding:14px 16px;margin-bottom:16px}
  .card h2{margin:0 0 10px;font-size:15px}
  .warn{background:#fff8e1;border:1px solid #f0d98a;color:#6b5400;font-size:13px;padding:8px 10px;border-radius:6px;margin-bottom:12px}
  form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  label{display:flex;flex-direction:column;font-size:12px;color:#4b5563;gap:3px}
  input,select{font:inherit;padding:7px 8px;border:1px solid #c5cbd3;border-radius:5px;background:#fff}
  .full{grid-column:1/-1}
  button{font:inherit;padding:8px 14px;border:0;border-radius:5px;background:#1f3a5f;color:#fff;cursor:pointer}
  button.ghost{background:#e5e7eb;color:#374151}
  .err{color:#b91c1c;font-size:13px;min-height:18px}
  .wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
  th,td{border-bottom:1px solid #e5e7eb;padding:7px 8px;text-align:left;white-space:nowrap}
  th{background:#f0f2f5;font-size:12px;color:#4b5563}
  td select{padding:4px 6px;font-size:13px}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px}
  .b-none{background:#fee2e2;color:#b91c1c;font-weight:bold}   /* 계약 결과 미입력 */
  .b-yes{background:#dcfce7;color:#166534}
  .b-hold{background:#fef3c7;color:#92400e}
  .b-fail{background:#e5e7eb;color:#374151}
  .empty{color:#6b7280;text-align:center;padding:20px}
  .tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:#4b5563}
</style>
</head>
<body>
<header>
  <h1>📒 문의 대장</h1>
  <a href="erp-map.html">← ERP 지도로</a>
</header>
<main>
  <section class="card">
    <h2>새 문의 넣기</h2>
    <div class="warn">이 화면은 이 브라우저(localStorage)에만 저장됩니다. 이름·연락처는 <b>가상 값만</b> 넣으세요. 실제 고객 정보는 넣지 마세요.</div>
    <form id="f" novalidate>
      <label>이름<input name="name" maxlength="40" placeholder="예: 가상김철수"></label>
      <label>연락처<input name="phone" inputmode="tel" placeholder="예: 010-0000-0001"></label>
      <label>관심 제품<select name="product">
        <option value="">선택 안 함</option><option>절삭공구</option><option>측정공구</option><option>연삭·연마</option><option>수공구·전동공구</option><option>작업용품·안전용품</option><option>기타</option>
      </select></label>
      <label>경로 (어디서 알고 오셨나)<select name="source">
        <option value="unknown">모름</option><option value="search">검색</option><option value="map">지도</option><option value="referral">지인 소개</option><option value="sns">SNS</option><option value="phone">전화</option><option value="other">기타</option>
      </select></label>
      <label>응대 단계<select name="stage"><option>접수</option><option>연락중</option><option>상담완료</option></select></label>
      <label>계약 결과<select name="result"><option value="">(비워둠)</option><option>계약</option><option>보류</option><option>실패</option></select></label>
      <div class="full"><button type="submit">문의 추가</button> <span class="err" id="err"></span></div>
    </form>
  </section>

  <section class="card">
    <div class="tools"><span id="count"></span><button class="ghost" id="clear" type="button">시험 데이터 전부 지우기</button></div>
    <div class="wrap">
      <table>
        <thead><tr><th>접수일</th><th>이름</th><th>연락처</th><th>관심 제품</th><th>경로</th><th>응대 단계</th><th>계약 결과</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
(function(){
  var KEY = "sht-erp-inquiry-ledger";
  var SRC = {search:"검색", map:"지도", referral:"지인 소개", sns:"SNS", phone:"전화", other:"기타", unknown:"모름"};
  var STAGES = ["접수","연락중","상담완료"];
  var RESULTS = ["계약","보류","실패"];
  var $ = function(id){ return document.getElementById(id); };

  function load(){ try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){ return []; } }
  function save(list){ try { localStorage.setItem(KEY, JSON.stringify(list)); } catch(e){ $("err").textContent = "이 브라우저에서는 저장이 막혀 있습니다."; } }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function today(){ var d = new Date(), p = function(n){ return (n<10?"0":"")+n; }; return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
  function opts(arr, cur){ return arr.map(function(v){ return '<option'+(v===cur?' selected':'')+'>'+v+'</option>'; }).join(""); }

  function resultBadge(r){
    if (!r) return '<span class="badge b-none">미입력</span>';
    var cls = r === "계약" ? "b-yes" : r === "보류" ? "b-hold" : "b-fail";
    return '<span class="badge '+cls+'">'+esc(r)+'</span>';
  }

  function render(){
    var list = load();
    $("count").textContent = "문의 " + list.length + "건";
    if (!list.length){ $("rows").innerHTML = '<tr><td colspan="7" class="empty">아직 문의가 없습니다. 위에서 가상 문의를 하나 넣어 보세요.</td></tr>'; return; }
    $("rows").innerHTML = list.slice().reverse().map(function(q){
      return '<tr>'+
        '<td>'+esc(q.date)+'</td>'+
        '<td>'+esc(q.name)+'</td>'+
        '<td>'+esc(q.phone)+'</td>'+
        '<td>'+esc(q.product || "-")+'</td>'+
        '<td>'+esc(SRC[q.source] || "모름")+'</td>'+
        '<td><select data-id="'+q.id+'" data-k="stage">'+opts(STAGES, q.stage)+'</select></td>'+
        '<td>'+resultBadge(q.result)+' <select data-id="'+q.id+'" data-k="result"><option value="">(비움)</option>'+opts(RESULTS, q.result)+'</select></td>'+
      '</tr>';
    }).join("");
  }

  $("f").addEventListener("submit", function(e){
    e.preventDefault();
    var f = e.target, name = f.name.value.trim(), phone = f.phone.value.trim();
    if (!name){ $("err").textContent = "이름을 넣어주세요."; return; }
    if (phone.replace(/\D/g,"").length < 9){ $("err").textContent = "연락처를 확인해주세요."; return; }
    $("err").textContent = "";
    var list = load();
    list.push({ id: Date.now() + "" + Math.floor(Math.random()*1000), date: today(), name: name, phone: phone,
      product: f.product.value, source: f.source.value, stage: f.stage.value, result: f.result.value });
    save(list);
    f.reset();
    render();
  });

  // 응대 단계 / 계약 결과는 서로 다른 칸 — 표에서 각각 따로 바꾼다
  $("rows").addEventListener("change", function(e){
    var t = e.target, id = t.getAttribute("data-id"), k = t.getAttribute("data-k");
    if (!id || !k) return;
    var list = load();
    list.forEach(function(q){ if (q.id === id) q[k] = t.value; });
    save(list);
    render();
  });

  $("clear").addEventListener("click", function(){
    if (confirm("이 브라우저에 저장된 문의 대장 시험 데이터를 모두 지울까요?")){ save([]); render(); }
  });

  render();
})();
</script>
</body>
</html>
