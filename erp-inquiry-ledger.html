<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>문의 대장 · (주)성환공구</title>
<link rel="stylesheet" href="erp-ledger.css">
</head>
<body data-screen="inq">
<header>
  <h1>📒 문의 대장</h1>
  <div class="r"><span id="who"></span><button class="ghost" id="logout" type="button" hidden>로그아웃</button><a href="erp-inquiry-ledger.html" class="on">문의 대장</a><a href="erp-customers.html">고객 대장</a><a href="erp-partners.html">거래처 대장</a><a href="erp-map.html">← ERP 지도로</a></div>
</header>

<main>
  <!-- 로그인 (대표 계정만 문의를 볼 수 있다) -->
  <section class="card" id="login">
    <h2>로그인</h2>
    <div class="note">홈페이지로 들어온 문의에는 고객 이름·연락처가 있어서, 로그인한 대표 계정만 볼 수 있습니다.</div>
    <form id="lf">
      <label>이메일<input name="email" type="email" autocomplete="username"></label>
      <label>비밀번호<input name="password" type="password" autocomplete="current-password"></label>
      <div><button type="submit" id="lbtn">로그인</button> <span class="err" id="lerr"></span></div>
    </form>
  </section>

  <div id="app" hidden>
    <section class="card">
      <h2>새 문의 넣기 <small style="font-weight:normal;color:#6b7280">(전화·방문 등 홈페이지 밖으로 온 문의를 직접 기록)</small></h2>
      <form id="f" novalidate>
        <label>이름<input name="name" maxlength="40"></label>
        <label>연락처<input name="phone" inputmode="tel" placeholder="010-0000-0000"></label>
        <label>관심 제품<select name="product">
          <option value="">선택하지 않음</option><option>공작기기</option><option>측정공구류</option><option>전동공구류</option><option>절삭공구</option><option>척(CHUCK) &amp; 아바(ARBOR)</option><option>스페셜 공구 제작(OEM)</option><option>기타</option>
        </select></label>
        <label>경로 (어디서 알고 오셨나)<select name="source">
          <option value="search">검색(네이버·구글 등)</option><option value="map">지도(네이버·카카오 지도)</option><option value="referral">지인 소개</option><option value="sns">SNS</option><option value="phone" selected>전화</option><option value="other">기타</option><option value="unknown">모르겠음</option>
        </select></label>
        <label>응대 단계<select name="stage"><option>접수</option><option>연락중</option><option>상담완료</option></select></label>
        <label>계약 결과<select name="result"><option value="">(비워둠)</option><option>계약</option><option>보류</option><option>실패</option></select></label>
        <label class="full">메모<input name="message" maxlength="1000"></label>
        <div class="full"><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" name="consent"> 고객이 개인정보 수집에 동의했음 (전화·방문 문의는 구두 동의)</label></div>
        <div class="full"><button type="submit" id="addbtn">문의 추가</button> <span class="err" id="err"></span></div>
      </form>
    </section>

    <section class="card">
      <div class="tools"><span id="count">불러오는 중…</span><button class="ghost" id="reload" type="button">새로고침</button></div>
      <div class="wrap">
        <table>
          <thead><tr><th>접수일</th><th>번호</th><th>이름</th><th>연락처</th><th>관심 제품</th><th>경로</th><th>내용</th><th>응대 단계</th><th>계약 결과</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="erp-ledger.js"></script>
</body>
</html>
